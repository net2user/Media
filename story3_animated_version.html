<title>Story 3 Animated – Dual-Use AI Financial System</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background:#F1F5F9;
    display:flex; justify-content:center; align-items:center;
    min-height:100vh; padding:20px;
  }
  .wrap { width:1200px; max-width:100%; }
  svg {
    display:block; width:100%; height:auto;
    border-radius:14px;
    box-shadow:0 4px 32px rgba(0,0,0,.12);
  }

  /* ── Staggered fade-in ── */
  .fi { opacity:0; animation: fadeIn .55s ease forwards; }
  @keyframes fadeIn { to { opacity:1; } }
  .d1{animation-delay:.1s} .d2{animation-delay:.35s} .d3{animation-delay:.6s}
  .d4{animation-delay:.85s} .d5{animation-delay:1.1s} .d6{animation-delay:1.35s}
  .d7{animation-delay:1.6s} .d8{animation-delay:1.85s} .d9{animation-delay:2.1s}

  /* ── Flowing dashed lines ── */
  /* Flow direction: positive offset = leftward/upward; negative = rightward/downward */
  @keyframes flowRight { to { stroke-dashoffset: -40; } }
  @keyframes flowLeft  { to { stroke-dashoffset:  40; } }
  @keyframes flowDown  { to { stroke-dashoffset: -40; } }

  .fl-right { stroke-dasharray:8 6; animation: flowRight 1.2s linear infinite; }
  .fl-left  { stroke-dasharray:8 6; animation: flowLeft  1.2s linear infinite; }
  .fl-down  { stroke-dasharray:6 5; animation: flowDown  1s   linear infinite; }

  /* ── Pulse on Mythos centre node ── */
  @keyframes mythosPulse {
    0%,100% { opacity:.18; r:28; }
    50%      { opacity:.38; r:44; }
  }
  .pulse-ring { animation: mythosPulse 2s ease-in-out infinite; }

  /* ── Stat slide-up ── */
  @keyframes slideUp {
    from { opacity:0; transform:translateY(10px); }
    to   { opacity:1; transform:translateY(0); }
  }
  .su { opacity:0; animation: slideUp .5s ease forwards; }
  .su1{animation-delay:1.0s} .su2{animation-delay:1.25s}

  /* ── Card pop ── */
  @keyframes cardPop {
    from { opacity:0; transform:scale(.88) translateY(10px); }
    to   { opacity:1; transform:scale(1)   translateY(0); }
  }
  .cp { opacity:0; animation: cardPop .4s cubic-bezier(.34,1.56,.64,1) forwards; }
  .cp1{animation-delay:1.8s} .cp2{animation-delay:2.0s} .cp3{animation-delay:2.2s}

  /* ── Warning pulse on bottom bar ── */
  @keyframes warnPulse {
    0%,100%{ fill:#FFF8F8; }
    50%    { fill:#FCE8E6; }
  }
  .warn-bar { animation: warnPulse 3s ease-in-out infinite 2.5s; }

  /* ── Blink cursor ── */
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
  .cursor { animation: blink 1s step-end infinite; }
</style>
