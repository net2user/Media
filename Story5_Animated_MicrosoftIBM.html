<style>
  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

  body {
    background: #F1F5F9;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 16px;
    font-family: system-ui, -apple-system, sans-serif;
    overflow-x: hidden;
  }

  .outer {
    width: 100%;
    max-width: 1200px;
    position: relative;
  }

  /* zoom / pan container */
  .zoom-wrap {
    width: 100%;
    overflow: hidden;
    border-radius: 14px;
    box-shadow: 0 4px 28px rgba(0,0,0,0.11);
    cursor: grab;
    touch-action: none;
    background: #fff;
  }
  .zoom-wrap:active { cursor: grabbing; }

  svg#main {
    display: block;
    width: 100%;
    height: auto;
    user-select: none;
  }

  /* zoom controls */
  .zoom-controls {
    display: flex;
    gap: 8px;
    justify-content: flex-end;
    margin-bottom: 8px;
  }
  .zoom-controls button {
    background: #fff;
    border: 1.5px solid #DADCE0;
    border-radius: 6px;
    width: 36px; height: 36px;
    font-size: 18px;
    cursor: pointer;
    color: #202124;
    line-height: 1;
    transition: background .15s;
  }
  .zoom-controls button:hover { background: #F1F5F9; }

  /* ── ANIMATIONS ── */
  @keyframes fadeIn  { from{opacity:0} to{opacity:1} }
  @keyframes slideUp { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }
  @keyframes slideLeft { from{opacity:0;transform:translateX(14px)} to{opacity:1;transform:translateX(0)} }
  @keyframes slideRight{ from{opacity:0;transform:translateX(-14px)} to{opacity:1;transform:translateX(0)} }

  /* sequential reveals */
  .a0  { animation: fadeIn   .6s ease .1s  both; }
  .a1  { animation: slideUp  .6s ease .4s  both; }
  .a2  { animation: slideLeft .6s ease .8s both; }
  .a3  { animation: slideRight.6s ease .8s both; }
  .a4  { animation: slideUp  .6s ease 1.2s both; }
  .a5  { animation: slideUp  .6s ease 1.6s both; }
  .a6  { animation: slideUp  .6s ease 2.0s both; }
  .a7  { animation: slideUp  .6s ease 2.4s both; }
  .a8  { animation: slideUp  .6s ease 2.8s both; }
  .a9  { animation: fadeIn   .6s ease 3.2s both; }

  /* flowing dotted connector */
  @keyframes flowDash {
    from { stroke-dashoffset: 0; }
    to   { stroke-dashoffset: -40; }
  }
  .connector {
    stroke-dasharray: 5 7;
    stroke-dashoffset: 0;
    animation: flowDash 1.8s linear infinite;
    fill: none;
    stroke-width: 1.5;
  }
  .con-blue   { stroke: #4285F4; }
  .con-red    { stroke: #EA4335; }
  .con-yellow { stroke: #FBBC05; }
  .con-green  { stroke: #34A853; }

  /* pulsing centre node */
  @keyframes centrePulse {
    0%,100% { r: 46; opacity: 1; }
    50%      { r: 52; opacity: .85; }
  }
  .centre-pulse { animation: centrePulse 2.4s ease-in-out infinite; }

  /* metric bar grow */
  @keyframes growB1 { from{width:0} to{width:180px} }
  @keyframes growB2 { from{width:0} to{width:220px} }
  @keyframes growB3 { from{width:0} to{width:160px} }
  @keyframes growB4 { from{width:0} to{width:200px} }
  .mb1 { animation: growB1 1.1s ease-out 1.4s both; }
  .mb2 { animation: growB2 1.1s ease-out 1.8s both; }
  .mb3 { animation: growB3 1.1s ease-out 2.2s both; }
  .mb4 { animation: growB4 1.1s ease-out 2.6s both; }
  .mv1,.mv2,.mv3,.mv4 { animation: fadeIn .3s ease both; }
  .mv1 { animation-delay:2.5s; }
  .mv2 { animation-delay:2.9s; }
  .mv3 { animation-delay:3.3s; }
  .mv4 { animation-delay:3.7s; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>

<script>
  /* ── Zoom and Pan ── */
  const wrap = document.getElementById('zoomWrap');
  const svg  = document.getElementById('main');
  let scale = 1, tx = 0, ty = 0;
  let dragging = false, startX = 0, startY = 0, lastTx = 0, lastTy = 0;

  function applyTransform() {
    svg.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`;
    svg.style.transformOrigin = '0 0';
  }

  document.getElementById('zIn').addEventListener('click', () => {
    scale = Math.min(scale + 0.25, 4);
    applyTransform();
  });
  document.getElementById('zOut').addEventListener('click', () => {
    scale = Math.max(scale - 0.25, 0.4);
    if (scale <= 1) { tx = 0; ty = 0; }
    applyTransform();
  });
  document.getElementById('zRst').addEventListener('click', () => {
    scale = 1; tx = 0; ty = 0;
    applyTransform();
  });

  /* Mouse drag */
  wrap.addEventListener('mousedown', e => {
    if (scale <= 1) return;
    dragging = true; startX = e.clientX; startY = e.clientY;
    lastTx = tx; lastTy = ty;
  });
  window.addEventListener('mousemove', e => {
    if (!dragging) return;
    tx = lastTx + (e.clientX - startX);
    ty = lastTy + (e.clientY - startY);
    applyTransform();
  });
  window.addEventListener('mouseup', () => { dragging = false; });

  /* Wheel zoom */
  wrap.addEventListener('wheel', e => {
    e.preventDefault();
    const delta = e.deltaY > 0 ? -0.15 : 0.15;
    scale = Math.min(Math.max(scale + delta, 0.4), 4);
    if (scale <= 1) { tx = 0; ty = 0; }
    applyTransform();
  }, { passive: false });

  /* Touch pinch-zoom */
  let lastDist = 0;
  wrap.addEventListener('touchstart', e => {
    if (e.touches.length === 2) {
      lastDist = Math.hypot(
        e.touches[0].clientX - e.touches[1].clientX,
        e.touches[0].clientY - e.touches[1].clientY
      );
    } else if (e.touches.length === 1 && scale > 1) {
      dragging = true;
      startX = e.touches[0].clientX; startY = e.touches[0].clientY;
      lastTx = tx; lastTy = ty;
    }
  }, { passive: true });
  wrap.addEventListener('touchmove', e => {
    if (e.touches.length === 2) {
      const dist = Math.hypot(
        e.touches[0].clientX - e.touches[1].clientX,
        e.touches[0].clientY - e.touches[1].clientY
      );
      scale = Math.min(Math.max(scale * (dist / lastDist), 0.4), 4);
      lastDist = dist;
      if (scale <= 1) { tx = 0; ty = 0; }
      applyTransform();
    } else if (e.touches.length === 1 && dragging) {
      tx = lastTx + (e.touches[0].clientX - startX);
      ty = lastTy + (e.touches[0].clientY - startY);
      applyTransform();
    }
  }, { passive: true });
  wrap.addEventListener('touchend', () => { dragging = false; });
</script>
</body>
