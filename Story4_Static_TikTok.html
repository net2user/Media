<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Story 4 Static - TikTok Remix Governance</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#F1F5F9; display:flex; justify-content:center; align-items:center; min-height:100vh; padding:20px; }
.wrap { width:1200px; max-width:100%; }
svg { display:block; width:100%; height:auto; border-radius:12px; box-shadow:0 4px 24px rgba(0,0,0,.10); }
</style>
</head>
<body>
<div class="wrap">
<svg viewBox="0 0 1200 660" xmlns="http://www.w3.org/2000/svg"
     font-family="system-ui,-apple-system,sans-serif" text-rendering="optimizeLegibility">

  <rect width="1200" height="660" fill="#FFFFFF"/>
  <pattern id="dp" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="12" cy="12" r=".8" fill="#E2E8F0"/></pattern>
  <rect width="1200" height="660" fill="url(#dp)"/>
  <rect x="0"   y="0" width="300" height="5" fill="#4285F4"/>
  <rect x="300" y="0" width="300" height="5" fill="#EA4335"/>
  <rect x="600" y="0" width="300" height="5" fill="#FBBC05"/>
  <rect x="900" y="0" width="300" height="5" fill="#34A853"/>
  <rect x="0" y="655" width="1200" height="5" fill="#FBBC05"/>

  <!-- Header -->
  <text x="60" y="40" font-size="13" font-weight="600" fill="#9AA0A6" letter-spacing="2">TIKTOK REMIX · PLATFORM GOVERNANCE · CONSENT ARCHITECTURE · DEFAULT OPT-IN</text>
  <text x="60" y="84" font-size="44" font-weight="900" fill="#202124">The Friction Is the Governance.</text>
  <text x="60" y="112" font-size="17" fill="#5F6368">Default opt-in is not a design choice. It is a governance tell.</text>
  <line x1="60" y1="128" x2="1140" y2="128" stroke="#DADCE0" stroke-width="1.5"/>

  <!-- LEFT: Three consent questions -->
  <rect x="55" y="142" width="500" height="376" rx="10" fill="#F8F9FA" stroke="#DADCE0" stroke-width="1"/>
  <text x="305" y="166" font-size="13" font-weight="700" fill="#4285F4" text-anchor="middle">THREE CONSENT QUESTIONS PLATFORMS COLLAPSE INTO ONE</text>
  <line x1="68" y1="174" x2="542" y2="174" stroke="#DADCE0" stroke-width=".5"/>

  <!-- Q1 -->
  <rect x="68" y="182" width="470" height="96" rx="8" fill="#FCE8E6" stroke="#EA4335" stroke-width="1"/>
  <rect x="68" y="182" width="5" height="96" rx="2" fill="#EA4335"/>
  <text x="88" y="204" font-size="12" font-weight="700" fill="#EA4335">01 · CREATIVE RIGHTS</text>
  <text x="88" y="224" font-size="13" fill="#202124">Does publishing a public video mean consenting to AI-generated</text>
  <text x="88" y="242" font-size="13" fill="#202124">synthetic reinterpretations of your likeness, voice, and creative</text>
  <text x="88" y="260" font-size="13" fill="#202124">style by unknown users through generative systems?</text>
  <text x="88" y="272" font-size="11" font-weight="600" fill="#EA4335">Current platform answer: Yes, by default.</text>

  <!-- Q2 -->
  <rect x="68" y="288" width="470" height="96" rx="8" fill="#FEF7E0" stroke="#FBBC05" stroke-width="1"/>
  <rect x="68" y="288" width="5" height="96" rx="2" fill="#FBBC05"/>
  <text x="88" y="310" font-size="12" font-weight="700" fill="#92400E">02 · TRAINING DATA</text>
  <text x="88" y="330" font-size="13" fill="#202124">TikTok says content not used for model training. But "not used</text>
  <text x="88" y="348" font-size="13" fill="#202124">for training" does not mean "not used for generation."</text>
  <text x="88" y="366" font-size="13" fill="#202124">Two questions need two separate consent mechanisms.</text>
  <text x="88" y="378" font-size="11" font-weight="600" fill="#92400E">The distinction is not being made visible to creators.</text>

  <!-- Q3 -->
  <rect x="68" y="394" width="470" height="96" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1"/>
  <rect x="68" y="394" width="5" height="96" rx="2" fill="#4285F4"/>
  <text x="88" y="416" font-size="12" font-weight="700" fill="#4285F4">03 · RECOURSE AND HARM</text>
  <text x="88" y="436" font-size="13" fill="#202124">When AI-generated derivatives cause reputational distortion or</text>
  <text x="88" y="454" font-size="13" fill="#202124">commercial damage — what recourse does the creator have?</text>
  <text x="88" y="472" font-size="13" fill="#202124">Current answer: effectively none.</text>
  <text x="88" y="484" font-size="11" font-weight="600" fill="#4285F4">This is where governance architecture is most immature.</text>

  <!-- Gartner stat -->
  <rect x="68" y="500" width="470" height="10" rx="3" fill="#FBBC05" opacity=".3"/>
  <text x="88" y="510" font-size="12" font-weight="700" fill="#92400E">68% of consumers</text>
  <text x="226" y="510" font-size="12" fill="#202124"> would reduce platform use if AI used their content without consent · Gartner 2024</text>

  <!-- RIGHT TOP: Default vs consent -->
  <rect x="575" y="142" width="575" height="192" rx="10" fill="#F8F9FA" stroke="#DADCE0" stroke-width="1"/>
  <text x="862" y="166" font-size="13" font-weight="700" fill="#EA4335" text-anchor="middle">THE OPT-OUT BURDEN · NO GLOBAL TOGGLE · POST BY POST</text>
  <line x1="588" y1="174" x2="1138" y2="174" stroke="#DADCE0" stroke-width=".5"/>

  <rect x="588" y="182" width="268" height="138" rx="8" fill="#FCE8E6" stroke="#EA4335" stroke-width="1"/>
  <text x="722" y="204" font-size="12" font-weight="700" fill="#EA4335" text-anchor="middle">WHAT TIKTOK DID</text>
  <text x="722" y="224" font-size="13" fill="#202124" text-anchor="middle">Feature activated silently</text>
  <text x="722" y="242" font-size="13" fill="#202124" text-anchor="middle">No notification to creators</text>
  <text x="722" y="260" font-size="13" fill="#202124" text-anchor="middle">No global toggle built</text>
  <text x="722" y="278" font-size="13" fill="#202124" text-anchor="middle">Post-by-post opt-out only</text>
  <text x="722" y="296" font-size="11" fill="#9AA0A6" text-anchor="middle">Participation velocity > consent</text>
  <text x="722" y="312" font-size="11" font-weight="600" fill="#EA4335" text-anchor="middle">Friction is the mechanism</text>

  <rect x="876" y="182" width="272" height="138" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1"/>
  <text x="1012" y="204" font-size="12" font-weight="700" fill="#34A853" text-anchor="middle">WHAT CONSENT REQUIRES</text>
  <text x="1012" y="224" font-size="13" fill="#202124" text-anchor="middle">Explicit opt-in before activate</text>
  <text x="1012" y="242" font-size="13" fill="#202124" text-anchor="middle">Clear creator notification</text>
  <text x="1012" y="260" font-size="13" fill="#202124" text-anchor="middle">Global toggle available</text>
  <text x="1012" y="278" font-size="13" fill="#202124" text-anchor="middle">Recourse for derivative harm</text>
  <text x="1012" y="296" font-size="11" fill="#9AA0A6" text-anchor="middle">Governance > participation</text>
  <text x="1012" y="312" font-size="11" font-weight="600" fill="#34A853" text-anchor="middle">Design intent is visible</text>

  <!-- RIGHT MIDDLE: Regulatory -->
  <rect x="575" y="348" width="575" height="88" rx="10" fill="#FEF7E0" stroke="#FBBC05" stroke-width="1.5"/>
  <rect x="575" y="348" width="5" height="88" rx="2" fill="#FBBC05"/>
  <text x="593" y="372" font-size="12" font-weight="700" fill="#92400E">THE REGULATORY WINDOW IS OPEN · PLATFORMS KNOW IT</text>
  <text x="593" y="392" font-size="13" fill="#202124">EU AI Act in force August 2024 · disclosure obligations for AI-generated media ·</text>
  <text x="593" y="410" font-size="13" fill="#202124">consent mechanics for creator content remain underdeveloped.</text>
  <text x="593" y="428" font-size="12" font-weight="600" fill="#92400E">FTC signalled interest · enforcement slower than deployment cycles. Platforms acting accordingly.</text>

  <!-- RIGHT BOTTOM: Enterprise exposure -->
  <rect x="575" y="450" width="575" height="68" rx="10" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <rect x="575" y="450" width="5" height="68" rx="2" fill="#4285F4"/>
  <text x="593" y="474" font-size="12" font-weight="700" fill="#4285F4">THE ENTERPRISE EXPOSURE NOBODY IS GOVERNING</text>
  <text x="593" y="494" font-size="13" fill="#202124">Employees post branded materials and professional commentary on public platforms daily.</text>
  <text x="593" y="512" font-size="12" font-weight="600" fill="#4285F4">Enterprise AI governance has not extended to this external exposure surface yet.</text>

  <!-- Bottom statement -->
  <rect x="55" y="538" width="1090" height="52" rx="8" fill="#F8F9FA" stroke="#DADCE0" stroke-width="1"/>
  <rect x="55" y="538" width="5" height="52" rx="2" fill="#FBBC05"/>
  <text x="600" y="560" font-size="15" font-weight="700" fill="#202124" text-anchor="middle">The clearest signal of platform priorities is no longer what the policy says.</text>
  <text x="600" y="578" font-size="13" fill="#5F6368" text-anchor="middle">It is where the friction lives. Default opt-in is a governance tell. Platforms that are confident their AI features serve creators do not need to hide them.</text>

  <text x="600" y="614" font-size="10" fill="#9AA0A6" text-anchor="middle">Source: TikTok Remix May 2026 · TikTok statement to CNET · Gartner Digital Governance Survey 2024 · EU AI Act August 2024 · FTC AI signals 2025-2026</text>
  <text x="600" y="630" font-size="11" fill="#9AA0A6" text-anchor="middle">Created by Vikas Sharma · DigitalWalk · vikas-sharma-digitalwalk.blogspot.com · linkedin.com/in/sharma1vikas · X: @digitalwalk</text>

</svg>
</div>
</body>
</html>
