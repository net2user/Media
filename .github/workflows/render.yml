name: Render HTML to GIF and MP4

"on":
  push:
    paths:
      - 'ai-governance/default-opt-in-ai-governance/index.html'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ffmpeg \
            gifsicle \
            fonts-liberation \
            libatk-bridge2.0-0 \
            libatk1.0-0 \
            libcups2 \
            libdrm2 \
            libgbm1 \
            libgtk-3-0 \
            libnss3 \
            libxcomposite1 \
            libxdamage1 \
            libxfixes3 \
            libxrandr2 \
            libxss1

      - name: Set up Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: '20'

      - name: Install Puppeteer
        run: npm install puppeteer

      - name: Capture animation frames
        run: |
          mkdir -p frames
          node - <<'EOF'
          const puppeteer = require('puppeteer');
          const path = require('path');

          (async () => {
            const browser = await puppeteer.launch({
              headless: 'new',
              args: [
                '--no-sandbox',
                '--disable-setuid-sandbox',
                '--disable-dev-shm-usage',
                '--disable-gpu',
                '--window-size=1160,652'
              ]
            });

            const page = await browser.newPage();
            await page.setViewport({ width: 1160, height: 652, deviceScaleFactor: 2 });

            const filePath = path.resolve('ai-governance/default-opt-in-ai-governance/index.html');
            await page.goto('file://' + filePath, { waitUntil: 'networkidle0' });

            // Let CSS animations initialise
            await new Promise(r => setTimeout(r, 500));

            const totalFrames = 120; // 4 seconds at 30 fps
            const frameInterval = 1000 / 30;

            for (let i = 0; i < totalFrames; i++) {
              await page.screenshot({
                path: `frames/frame_${String(i).padStart(4, '0')}.png`,
                type: 'png',
                clip: { x: 0, y: 0, width: 1160, height: 652 }
              });
              await new Promise(r => setTimeout(r, frameInterval));
            }

            await browser.close();
            console.log(`Captured ${totalFrames} frames.`);
          })();
          EOF

      - name: Verify frames were captured
        run: |
          COUNT=$(ls frames/frame_*.png 2>/dev/null | wc -l)
          echo "Frame count: $COUNT"
          if [ "$COUNT" -lt 10 ]; then
            echo "ERROR: Too few frames captured ($COUNT). Aborting."
            exit 1
          fi

      - name: Build MP4
        run: |
          mkdir -p output
          ffmpeg -y \
            -framerate 30 \
            -i frames/frame_%04d.png \
            -vf "scale=1160:652:flags=lanczos" \
            -c:v libx264 \
            -preset slow \
            -crf 18 \
            -pix_fmt yuv420p \
            -movflags +faststart \
            output/default-opt-in-ai-governance.mp4
          echo "MP4 size: $(du -sh output/default-opt-in-ai-governance.mp4 | cut -f1)"

      - name: Build GIF (palette-optimised)
        run: |
          ffmpeg -y \
            -framerate 30 \
            -i frames/frame_%04d.png \
            -vf "fps=15,scale=1160:652:flags=lanczos,palettegen=max_colors=256:stats_mode=diff" \
            /tmp/palette.png

          ffmpeg -y \
            -framerate 30 \
            -i frames/frame_%04d.png \
            -i /tmp/palette.png \
            -filter_complex "fps=15,scale=1160:652:flags=lanczos[x];[x][1:v]paletteuse=dither=bayer:bayer_scale=5:diff_mode=rectangle" \
            output/default-opt-in-ai-governance.gif

          gifsicle -O3 --lossy=30 \
            output/default-opt-in-ai-governance.gif \
            -o output/default-opt-in-ai-governance.gif

          echo "GIF size: $(du -sh output/default-opt-in-ai-governance.gif | cut -f1)"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4.6.2
        with:
          name: rendered-media
          path: |
            output/default-opt-in-ai-governance.mp4
            output/default-opt-in-ai-governance.gif
          retention-days: 30

      - name: Commit rendered files back to repository
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cp output/default-opt-in-ai-governance.mp4 \
             ai-governance/default-opt-in-ai-governance/
          cp output/default-opt-in-ai-governance.gif \
             ai-governance/default-opt-in-ai-governance/
          git add \
            ai-governance/default-opt-in-ai-governance/default-opt-in-ai-governance.mp4 \
            ai-governance/default-opt-in-ai-governance/default-opt-in-ai-governance.gif
          git diff --cached --quiet || \
            git commit -m "ci: render GIF and MP4 for default-opt-in-ai-governance [skip ci]"
          git push
