  document.getElementById('lbl3'), // Human Checkpoints
  document.getElementById('lbl4'), // Multi-Model
  document.getElementById('lbl5'), // Policy First
  document.getElementById('lbl6'), // Architecture First
];

// Start orbiting after initial animations settle (2s)
let msAngle  = 0;   // start right side of inner orbit
let ibmAngle = 180; // start left side of outer orbit (opposite)
let started  = false;

// Label trigger angles (angle of ball when label should show)
const msLabelAngles  = [180, 270]; // left, top
const ibmLabelAngles = [270, 0, 90, 135]; // top, right, bottom-right, bottom-left
const msLabelIdx     = [0, 1];
const ibmLabelIdx    = [2, 3, 4, 5];

let lblActive = [false,false,false,false,false,false];
let lblTimers = [null,null,null,null,null,null];

function isNear(a, b, tol) {
  const diff = Math.abs(((a - b) % 360 + 360) % 360);
  return diff < tol || diff > 360 - tol;
}

function flashLabel(idx) {
  if (lblTimers[idx]) clearTimeout(lblTimers[idx]);
  lblEls[idx].style.opacity = '1';
  lblTimers[idx] = setTimeout(() => {
    lblEls[idx].style.opacity = '0';
  }, 1800);
}

function animate(ts) {
  if (!started) {
    requestAnimationFrame(animate);
    return;
  }

  msAngle  = (msAngle  + 0.55) % 360;
  ibmAngle = (ibmAngle + 0.35) % 360;

  const msPos  = ellipsePoint(CX, CY, innerRX, innerRY, msAngle);
  const ibmPos = ellipsePoint(CX, CY, outerRX, outerRY, ibmAngle);

  msBall.setAttribute('cx', msPos.x);
  msBall.setAttribute('cy', msPos.y);
  msText.setAttribute('x', msPos.x);
  msText.setAttribute('y', msPos.y);

  ibmBall.setAttribute('cx', ibmPos.x);
  ibmBall.setAttribute('cy', ibmPos.y);
  ibmText.setAttribute('x', ibmPos.x);
  ibmText.setAttribute('y', ibmPos.y);

  // Check MS ball label triggers
  msLabelAngles.forEach((trigAngle, i) => {
    if (isNear(msAngle, trigAngle, 6)) {
      flashLabel(msLabelIdx[i]);
    }
  });

  // Check IBM ball label triggers
  ibmLabelAngles.forEach((trigAngle, i) => {
    if (isNear(ibmAngle, trigAngle, 6)) {
      flashLabel(ibmLabelIdx[i]);
    }
  });

  requestAnimationFrame(animate);
}

// Show balls and start after 2s
setTimeout(() => {
  msBall.setAttribute('opacity', '1');
  msText.setAttribute('opacity', '1');
  ibmBall.setAttribute('opacity', '1');
  ibmText.setAttribute('opacity', '1');
  started = true;
}, 2000);

// Smooth label transitions
lblEls.forEach(el => {
  el.style.transition = 'opacity 0.4s ease';
});

requestAnimationFrame(animate);
</script>
</body>
