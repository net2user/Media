  <title>Governance by Design – Static Cover</title>

  <rect width="1200" height="680" fill="#FFFFFF"/>

    <circle cx="14" cy="14" r=".7" fill="#E8EAED"/>

  <rect x="900" y="0" width="300" height="5" fill="#34A853"/>
  <rect x="0" y="675" width="1200" height="5" fill="#34A853"/>

  <!-- HEADER -->
  <text x="600" y="38" font-size="12" font-weight="600" fill="#9AA0A6" letter-spacing="1.8" text-anchor="middle">MICROSOFT AGENT 365 · IBM BOB · ENTERPRISE AI GOVERNANCE · MAY 2026</text>
  <text x="600" y="80" font-size="42" font-weight="900" fill="#202124" text-anchor="middle">Governance by Design.</text>
  <text x="600" y="106" font-size="16" fill="#5F6368" text-anchor="middle">What getting AI accountability right actually looks like · two companies showed the industry this week</text>
  <line x1="60" y1="120" x2="1140" y2="120" stroke="#DADCE0" stroke-width="1.5"/>

  <!-- STAT CARDS TOP -->
  <!-- Gartner -->
  <rect x="60" y="134" width="240" height="86" rx="8" fill="#FEF7E0" stroke="#FBBC05" stroke-width="1.2"/>
  <rect x="60" y="134" width="240" height="5" rx="2" fill="#FBBC05"/>
  <text x="180" y="164" font-size="34" font-weight="900" fill="#92400E" text-anchor="middle">&lt;10%</text>
  <text x="180" y="182" font-size="13" fill="#202124" text-anchor="middle">enterprises with mature</text>
  <text x="180" y="198" font-size="13" fill="#202124" text-anchor="middle">AI governance frameworks</text>
  <text x="180" y="212" font-size="10" fill="#5F6368" text-anchor="middle">Gartner AI Governance Survey · 2024</text>

  <!-- McKinsey -->
  <rect x="900" y="134" width="240" height="86" rx="8" fill="#FCE8E6" stroke="#EA4335" stroke-width="1.2"/>
  <rect x="900" y="134" width="240" height="5" rx="2" fill="#EA4335"/>
  <text x="1020" y="164" font-size="34" font-weight="900" fill="#EA4335" text-anchor="middle">44%</text>
  <text x="1020" y="182" font-size="13" fill="#202124" text-anchor="middle">orgs had AI inaccuracy</text>
  <text x="1020" y="198" font-size="13" fill="#202124" text-anchor="middle">affect business decisions</text>
  <text x="1020" y="212" font-size="10" fill="#5F6368" text-anchor="middle">McKinsey State of AI · 2024</text>

  <!-- MICROSOFT BOX -->
  <rect x="60" y="134" width="1" height="1" fill="none"/><!-- spacer -->
  <rect x="310" y="134" width="248" height="130" rx="10" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.5"/>
  <rect x="310" y="134" width="248" height="6" rx="3" fill="#4285F4"/>
  <circle cx="344" cy="170" r="14" fill="#4285F4" opacity=".15"/>
  <text x="344" y="175" font-size="13" font-weight="700" fill="#4285F4" text-anchor="middle">M</text>
  <text x="374" y="166" font-size="13" font-weight="700" fill="#4285F4">MICROSOFT</text>
  <text x="374" y="182" font-size="13" font-weight="700" fill="#4285F4">AGENT 365</text>
  <text x="326" y="202" font-size="14" fill="#202124">AI workers governed by same</text>
  <text x="326" y="218" font-size="14" fill="#202124">identity, permissions, and audit</text>
  <text x="326" y="234" font-size="14" fill="#202124">controls as human employees.</text>
  <text x="326" y="255" font-size="13" fill="#5F6368">GA · May 2026</text>

  <!-- IBM BOX -->
  <rect x="642" y="134" width="248" height="130" rx="10" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <rect x="642" y="134" width="248" height="6" rx="3" fill="#34A853"/>
  <circle cx="676" cy="170" r="14" fill="#34A853" opacity=".15"/>
  <text x="676" y="175" font-size="13" font-weight="700" fill="#34A853" text-anchor="middle">I</text>
  <text x="706" y="166" font-size="13" font-weight="700" fill="#34A853">IBM BOB</text>
  <text x="706" y="182" font-size="13" font-weight="700" fill="#34A853">AI CODING PLATFORM</text>
  <text x="658" y="202" font-size="14" fill="#202124">Human checkpoints baked into</text>
  <text x="658" y="218" font-size="14" fill="#202124">architecture as a design</text>
  <text x="658" y="234" font-size="14" fill="#202124">requirement, not configuration.</text>
  <text x="658" y="255" font-size="13" fill="#5F6368">Launch · May 2026</text>

  <!-- Dotted connector centre line -->
  <line x1="558" y1="199" x2="642" y2="199" stroke="#4285F4" stroke-width="1.2" stroke-dasharray="4 5"/>

  <!-- FOUR PRINCIPLE CARDS -->
  <rect x="60" y="282" width="258" height="108" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.2"/>
  <rect x="60" y="282" width="258" height="5" rx="2" fill="#4285F4"/>
  <text x="189" y="304" font-size="13" font-weight="700" fill="#4285F4" text-anchor="middle">SAME IDENTITY FRAMEWORK</text>
  <text x="76" y="322" font-size="14" fill="#202124">AI agent access managed by</text>
  <text x="76" y="338" font-size="14" fill="#202124">same IT admin, same interface,</text>
  <text x="76" y="354" font-size="14" fill="#202124">same controls as humans.</text>
  <text x="76" y="378" font-size="13" fill="#5F6368">Unified audit. No translation needed.</text>

  <rect x="338" y="282" width="258" height="108" rx="8" fill="#E8F0FE" stroke="#4285F4" stroke-width="1.2"/>
  <rect x="338" y="282" width="258" height="5" rx="2" fill="#4285F4"/>
  <text x="467" y="304" font-size="13" font-weight="700" fill="#4285F4" text-anchor="middle">INTELLIGIBLE AUDIT TRAIL</text>
  <text x="354" y="322" font-size="14" fill="#202124">Regulator asks what happened.</text>
  <text x="354" y="338" font-size="14" fill="#202124">Answer in same format as any</text>
  <text x="354" y="354" font-size="14" fill="#202124">human employee action.</text>
  <text x="354" y="378" font-size="13" fill="#5F6368">Compliance-ready by default.</text>

  <rect x="616" y="282" width="258" height="108" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.2"/>
  <rect x="616" y="282" width="258" height="5" rx="2" fill="#34A853"/>
  <text x="745" y="304" font-size="13" font-weight="700" fill="#34A853" text-anchor="middle">HUMAN CHECKPOINTS</text>
  <text x="632" y="322" font-size="14" fill="#202124">Decision points within task</text>
  <text x="632" y="338" font-size="14" fill="#202124">execution, not only at start</text>
  <text x="632" y="354" font-size="14" fill="#202124">and end of workflow.</text>
  <text x="632" y="378" font-size="13" fill="#5F6368">Failures happen in the middle.</text>

  <rect x="894" y="282" width="246" height="108" rx="8" fill="#E6F4EA" stroke="#34A853" stroke-width="1.2"/>
  <rect x="894" y="282" width="246" height="5" rx="2" fill="#34A853"/>
  <text x="1017" y="304" font-size="13" font-weight="700" fill="#34A853" text-anchor="middle">MULTI-MODEL ROUTING</text>
  <text x="910" y="322" font-size="14" fill="#202124">Best model per task. Reduces</text>
  <text x="910" y="338" font-size="14" fill="#202124">single-model dependency</text>
  <text x="910" y="354" font-size="14" fill="#202124">and failure concentration.</text>
  <text x="910" y="378" font-size="13" fill="#5F6368">Governance through architecture.</text>

  <!-- CONTRAST STRIP -->
  <rect x="60" y="406" width="495" height="88" rx="10" fill="#FCE8E6" stroke="#EA4335" stroke-width="1.5"/>
  <rect x="60" y="406" width="495" height="6" rx="3" fill="#EA4335"/>
  <text x="307" y="430" font-size="13" font-weight="700" fill="#EA4335" text-anchor="middle">POLICY-FIRST · THE OLD APPROACH</text>
  <text x="78" y="452" font-size="14" fill="#202124">Governance as policy. Applied retroactively.</text>
  <text x="78" y="470" font-size="14" fill="#202124">Gap discovered after the first incident occurs.</text>
  <text x="78" y="486" font-size="13" fill="#5F6368">90% of enterprises still here today.</text>

  <text x="580" y="455" font-size="26" fill="#4285F4" text-anchor="middle">→</text>

  <rect x="597" y="406" width="543" height="88" rx="10" fill="#E6F4EA" stroke="#34A853" stroke-width="1.5"/>
  <rect x="597" y="406" width="543" height="6" rx="3" fill="#34A853"/>
  <text x="868" y="430" font-size="13" font-weight="700" fill="#34A853" text-anchor="middle">ARCHITECTURE-FIRST · THE NEW STANDARD</text>
  <text x="615" y="452" font-size="14" fill="#202124">Governance as architecture. Shapes behaviour before it occurs.</text>
  <text x="615" y="470" font-size="14" fill="#202124">Built before the first consequential decision is made.</text>
  <text x="615" y="486" font-size="13" fill="#5F6368">Microsoft and IBM chose this path this week.</text>

  <!-- BOTTOM STATEMENT -->
  <rect x="60" y="512" width="1080" height="46" rx="8" fill="#F8F9FA" stroke="#DADCE0" stroke-width="1"/>
  <rect x="60" y="512" width="5" height="46" rx="2" fill="#34A853"/>
  <text x="606" y="530" font-size="15" font-weight="700" fill="#202124" text-anchor="middle">Accountability architecture can be built deliberately before the first incident or reactively after it.</text>
  <text x="606" y="548" font-size="14" fill="#5F6368" text-anchor="middle">Both paths reach the same destination. The difference is who pays the cost and how large it turns out to be.</text>
