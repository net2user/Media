<style>

svg { display:block; width:100%; height:auto; border-radius:12px; box-shadow:0 4px 24px rgba(0,0,0,.10); }

.p4{animation:slideUp .7s ease 2.2s both}

.tdl{animation:tL 2.6s ease-in-out 1.0s infinite}
.tdr{animation:tR 2.6s ease-in-out 1.6s infinite}
